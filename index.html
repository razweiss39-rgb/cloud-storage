<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VaultStream — Fast & Private Crypto Cloud Storage</title>
  <script src="https://jsdelivr.net"></script>
  <style>
    :root {
      --bg: #050814;
      --card: #0d1326;
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --text: #f8fafc;
      --muted: #94a3b8;
      --success: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      background-image: radial-gradient(circle at 50% 0%, rgba(99, 102, 241, 0.18) 0%, transparent 55%);
    }
    a { color: inherit; text-decoration: none; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }
    
    /* Navbar */
    nav {
      border-bottom: 1px solid var(--card-border);
      background: rgba(5, 8, 20, 0.85);
      backdrop-filter: blur(12px);
      position: sticky; top: 0; z-index: 100;
    }
    .nav-inner { display: flex; justify-content: space-between; align-items: center; height: 68px; }
    .logo { font-size: 1.4rem; font-weight: 800; letter-spacing: -0.5px; display: flex; align-items: center; gap: 8px; }
    .logo span { color: var(--primary); }
    .nav-links { display: flex; gap: 24px; font-size: 0.9rem; color: var(--muted); }
    .nav-links a:hover { color: var(--text); }
    .nav-actions { display: flex; gap: 10px; align-items: center; }

    /* Buttons */
    .btn {
      padding: 10px 18px; border-radius: 10px; font-weight: 600; font-size: 0.9rem;
      cursor: pointer; border: none; transition: 0.2s; display: inline-block; text-align: center;
    }
    .btn-outline { background: transparent; border: 1px solid var(--card-border); color: var(--text); }
    .btn-outline:hover { background: rgba(255,255,255,0.06); }
    .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 20px rgba(99, 102, 241, 0.35); }
    .btn-primary:hover { background: var(--primary-hover); transform: translateY(-1px); }
    .btn-lg { padding: 14px 28px; font-size: 1rem; border-radius: 12px; }

    /* Animated Center Logo */
    @keyframes floatLogo {
      0%, 100% { transform: translateY(0px); filter: drop-shadow(0 0 18px rgba(99, 102, 241, 0.55)); }
      50% { transform: translateY(-10px); filter: drop-shadow(0 12px 28px rgba(139, 92, 246, 0.75)); }
    }
    @keyframes pulseRing {
      0% { transform: scale(0.95); opacity: 0.7; }
      70% { transform: scale(1.25); opacity: 0; }
      100% { transform: scale(0.95); opacity: 0; }
    }
    .center-logo-wrap {
      position: relative; width: 96px; height: 96px; margin: 0 auto 24px;
      display: flex; align-items: center; justify-content: center;
    }
    .center-logo-ring {
      position: absolute; inset: 0; border-radius: 28px;
      border: 2px solid rgba(99, 102, 241, 0.6);
      animation: pulseRing 2.8s infinite ease-out;
    }
    .center-logo-box {
      width: 84px; height: 84px; border-radius: 24px;
      background: linear-gradient(135deg, #4f46e5 0%, #9333ea 100%);
      display: flex; align-items: center; justify-content: center;
      animation: floatLogo 3.5s infinite ease-in-out;
      border: 1px solid rgba(255,255,255,0.25);
    }

    /* Interactive Q&A Box */
    .qa-box {
      max-width: 720px; margin: 36px auto 0; background: var(--card);
      border: 1px solid rgba(99, 102, 241, 0.35); border-radius: 20px;
      padding: 24px; text-align: left; box-shadow: 0 10px 40px rgba(0,0,0,0.4);
    }
    .qa-header { font-size: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 0.8px; color: #a5b4fc; margin-bottom: 12px; display: flex; align-items: center; gap: 8px; }
    .qa-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); }
    .qa-chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
    .qa-chip {
      background: rgba(255,255,255,0.05); border: 1px solid var(--card-border);
      color: #e2e8f0; padding: 8px 14px; border-radius: 99px; font-size: 0.84rem;
      cursor: pointer; transition: 0.2s; font-family: inherit;
    }
    .qa-chip:hover, .qa-chip.active {
      background: rgba(99, 102, 241, 0.25); border-color: var(--primary); color: #fff;
    }
    .qa-answer {
      background: rgba(5, 8, 20, 0.7); border-left: 3px solid var(--primary);
      padding: 16px; border-radius: 10px; font-size: 0.94rem; color: #cbd5e1;
      min-height: 72px; transition: opacity 0.25s;
    }

    /* Hero */
    .hero { text-align: center; padding: 60px 20px 50px; max-width: 860px; margin: 0 auto; }
    .hero h1 { font-size: clamp(2.1rem, 5vw, 3.6rem); font-weight: 800; line-height: 1.15; letter-spacing: -1px; }
    .hero h1 span { color: #818cf8; }
    .hero p.subtitle { color: var(--muted); font-size: 1.1rem; margin: 18px auto 28px; max-width: 620px; }
    .hero-btns { display: flex; justify-content: center; gap: 14px; flex-wrap: wrap; }

    /* Stats */
    .stats {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 20px; border-top: 1px solid var(--card-border); border-bottom: 1px solid var(--card-border);
      padding: 32px 0; margin: 30px 0; text-align: center;
    }
    .stat-num { font-size: 1.8rem; font-weight: 800; color: #fff; }
    .stat-label { font-size: 0.82rem; color: var(--muted); margin-top: 4px; }

    /* Sections */
    .section { padding: 60px 0; }
    .section-header { text-align: center; max-width: 600px; margin: 0 auto 44px; }
    .section-header h2 { font-size: 2rem; font-weight: 800; }
    .section-header p { color: var(--muted); margin-top: 8px; }

    /* Features */
    .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(290px, 1fr)); gap: 24px; }
    .card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 18px; padding: 28px; transition: 0.25s;
    }
    .card:hover { border-color: rgba(99, 102, 241, 0.4); }
    .card h3 { font-size: 1.15rem; margin-bottom: 10px; }
    .card p { color: var(--muted); font-size: 0.92rem; }

    /* Comparison Table */
    .table-wrap { overflow-x: auto; background: var(--card); border-radius: 18px; border: 1px solid var(--card-border); }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.92rem; }
    th, td { padding: 16px 20px; border-bottom: 1px solid var(--card-border); }
    th { background: rgba(255,255,255,0.03); color: var(--muted); font-weight: 600; }
    .highlight-col { color: #818cf8; font-weight: 700; }
    .yes { color: var(--success); font-weight: 600; }
    .no { color: #f43f5e; }

    /* Pricing */
    .pricing-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(310px, 1fr)); gap: 24px; }
    .plan-card {
      background: var(--card); border: 1px solid var(--card-border);
      border-radius: 20px; padding: 30px; display: flex; flex-direction: column; justify-content: space-between;
    }
    .plan-card.popular {
      border: 2px solid var(--primary);
      background: linear-gradient(180deg, rgba(99,102,241,0.12) 0%, var(--card) 100%);
    }
    .plan-badge {
      display: inline-block; font-size: 0.75rem; font-weight: 700; padding: 4px 12px;
      border-radius: 99px; background: rgba(99,102,241,0.2); color: #a5b4fc; margin-bottom: 14px;
    }
    .plan-size { font-size: 2.2rem; font-weight: 800; margin: 6px 0; }
    .plan-price { font-size: 1.8rem; font-weight: 800; color: #818cf8; }
    .plan-price span { font-size: 0.9rem; color: var(--muted); font-weight: 400; }
    .plan-features { list-style: none; margin: 24px 0; border-top: 1px solid var(--card-border); padding-top: 20px; }
    .plan-features li { font-size: 0.9rem; color: #cbd5e1; margin-bottom: 10px; }
    .plan-features li::before { content: "✓ "; color: var(--success); font-weight: bold; }

    /* Dashboard */
    .dashboard { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 30px; margin: 30px auto; }
    .progress-bg { background: #1e293b; height: 10px; border-radius: 99px; margin-top: 10px; overflow: hidden; }
    .progress-fill { background: var(--primary); height: 100%; width: 2%; }
    .dropzone {
      border: 2px dashed rgba(99,102,241,0.4); border-radius: 16px; padding: 48px 20px;
      text-align: center; margin-top: 24px; cursor: pointer; background: rgba(99,102,241,0.03);
    }
    .dropzone:hover { border-color: var(--primary); }

    /* Legal & Footer */
    .legal { border-top: 1px solid var(--card-border); padding: 48px 0; font-size: 0.85rem; color: var(--muted); }
    .legal h3 { color: var(--text); margin-bottom: 12px; font-size: 1.1rem; }
    .legal p { margin-bottom: 10px; }
    footer { border-top: 1px solid var(--card-border); padding: 28px 0; text-align: center; font-size: 0.82rem; color: var(--muted); }

    /* Modal */
    .modal-backdrop {
      position: fixed; inset: 0; background: rgba(0,0,0,0.8);
      display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 200;
    }
    .modal { background: var(--card); border: 1px solid var(--card-border); border-radius: 20px; padding: 28px; width: 100%; max-width: 420px; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; font-size: 0.82rem; color: var(--muted); margin-bottom: 6px; }
    .form-group input[type="email"], .form-group input[type="password"] {
      width: 100%; padding: 12px; border-radius: 10px; background: var(--bg);
      border: 1px solid var(--card-border); color: #fff; font-size: 0.95rem;
    }
    .hidden { display: none !important; }
    @media (max-width: 768px) { .nav-links { display: none; } }
  </style>
</head>
<body>

  <!-- Navbar -->
  <nav>
