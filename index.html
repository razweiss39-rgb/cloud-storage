<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta
      name="description"
      content="Quick information about cloud file storage from VaultStream."
    />
    <meta name="theme-color" content="#070a18" />
    <title>VaultStream — Cloud Storage</title>
    <style>
      :root {
        color-scheme: dark;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        background: #070a18;
        color: #f8fafc;
        font-synthesis: none;
        text-rendering: optimizeLegibility;
        --muted: #a7b0c5;
        --primary: #818cf8;
        --card: rgba(15, 23, 48, 0.88);
        --border: rgba(255, 255, 255, 0.1);
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-width: 320px;
        min-height: 100vh;
        margin: 0;
        background:
          radial-gradient(ellipse at 50% 20%, rgba(99, 102, 241, 0.2), transparent 48%),
          #070a18;
      }

      .site-header {
        width: min(100% - 40px, 1120px);
        height: 72px;
        margin-inline: auto;
        display: flex;
        align-items: center;
        justify-content: space-between;
      }

      .brand {
        color: #f8fafc;
        font-size: 1.2rem;
        font-weight: 800;
        letter-spacing: -0.04em;
        text-decoration: none;
      }

      .brand span {
        color: var(--primary);
      }

      .language-select {
        padding: 8px 12px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #0d1326;
        color: #f8fafc;
        font: inherit;
        cursor: pointer;
      }

      .language-select:focus-visible {
        outline: 2px solid #c7d2fe;
        outline-offset: 3px;
      }

      main {
        min-height: calc(100vh - 72px);
        min-height: calc(100svh - 72px);
        display: grid;
        place-items: center;
        padding: 28px 20px 56px;
      }

      .hero {
        width: min(100%, 760px);
        text-align: center;
      }

      .logo-animation {
        position: relative;
        width: 104px;
        height: 104px;
        margin: 0 auto 24px;
        display: grid;
        place-items: center;
      }

      .logo-ring,
      .logo-mark {
        position: absolute;
        border-radius: 30px;
      }

      .logo-ring {
        inset: 3px;
        border: 1px solid rgba(129, 140, 248, 0.75);
        animation: pulse 2.8s ease-out infinite;
      }

      .logo-mark {
        width: 82px;
        height: 82px;
        display: grid;
        place-items: center;
        background: linear-gradient(140deg, #4f46e5, #9333ea);
        border: 1px solid rgba(255, 255, 255, 0.28);
        box-shadow: 0 16px 48px rgba(79, 70, 229, 0.28);
        animation: float 3.5s ease-in-out infinite;
      }

      .logo-mark svg {
        width: 44px;
        height: 44px;
      }

      @keyframes float {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-7px); }
      }

      @keyframes pulse {
        0% { transform: scale(0.94); opacity: 0.75; }
        75%, 100% { transform: scale(1.3); opacity: 0; }
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 6vw, 3.5rem);
        line-height: 1.15;
        letter-spacing: -0.04em;
      }

      h1 span {
        color: var(--primary);
      }

      .intro {
        max-width: 560px;
        margin: 16px auto 0;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.8;
      }

      .qa-card {
        margin-top: 32px;
        padding: 24px;
        border: 1px solid rgba(129, 140, 248, 0.28);
        border-radius: 20px;
        background: var(--card);
        text-align: start;
        box-shadow: 0 24px 80px rgba(0, 0, 0, 0.24);
      }

      .qa-heading {
        margin: 0 0 16px;
        display: flex;
        align-items: center;
        gap: 9px;
        color: #c7d2fe;
        font-size: 0.9rem;
        font-weight: 700;
      }

      .status-dot {
        width: 9px;
        height: 9px;
        flex: 0 0 auto;
        border-radius: 50%;
        background: #34d399;
        box-shadow: 0 0 12px rgba(52, 211, 153, 0.45);
      }

      .questions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .question-chip {
        min-height: 40px;
        padding: 8px 13px;
        border: 1px solid var(--border);
        border-radius: 999px;
        background: rgba(255, 255, 255, 0.04);
        color: #e2e8f0;
        font: inherit;
        font-size: 0.85rem;
        cursor: pointer;
        transition: background-color 160ms ease, border-color 160ms ease;
      }

      .question-chip:hover,
      .question-chip:focus-visible {
        border-color: var(--primary);
        background: rgba(99, 102, 241, 0.2);
      }

      .question-chip:focus-visible,
      .ask-button:focus-visible,
      .question-input:focus-visible {
        outline: 2px solid #c7d2fe;
        outline-offset: 3px;
      }

      .answer {
        min-height: 72px;
        padding: 15px 16px;
        border-inline-start: 3px solid var(--primary);
        border-radius: 10px;
        background: rgba(5, 8, 20, 0.72);
        color: #d3dbea;
        font-size: 0.94rem;
        line-height: 1.75;
      }

      .ask-form {
        display: flex;
        gap: 10px;
        margin-top: 14px;
      }

      .question-input {
        min-width: 0;
        flex: 1;
        padding: 11px 13px;
        border: 1px solid var(--border);
        border-radius: 10px;
        background: #090d1d;
        color: #f8fafc;
        font: inherit;
      }

      .question-input::placeholder {
        color: #8993aa;
      }

      .ask-button {
        padding: 10px 17px;
        border: 0;
        border-radius: 10px;
        background: #4f46e5;
        color: white;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      .ask-button:hover {
        background: #4338ca;
      }

      @media (max-width: 520px) {
        .site-header {
          height: 60px;
        }

        main {
          min-height: calc(100vh - 60px);
          min-height: calc(100svh - 60px);
          padding-inline: 16px;
        }

        .qa-card {
          padding: 18px;
        }

        .ask-form {
          flex-direction: column;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        *,
        *::before,
        *::after {
          animation-duration: 0.01ms !important;
          animation-iteration-count: 1 !important;
          scroll-behavior: auto !important;
          transition-duration: 0.01ms !important;
        }
      }

      .sr-only {
        position: absolute;
        width: 1px;
        height: 1px;
        padding: 0;
        margin: -1px;
        overflow: hidden;
        clip: rect(0, 0, 0, 0);
        white-space: nowrap;
        border: 0;
      }
    </style>
  </head>
  <body>
    <header class="site-header">
      <a class="brand" href="#" id="brand-link" aria-label="VaultStream — home">Vault<span>Stream</span></a>
      <label class="sr-only" for="language-select" id="language-label">Language</label>
      <select class="language-select" id="language-select" aria-labelledby="language-label">
        <option value="en" selected>English</option>
        <option value="he">עברית</option>
      </select>
    </header>

    <main>
      <section class="hero" aria-labelledby="page-title">
        <div class="logo-animation" aria-hidden="true">
          <div class="logo-ring"></div>
          <div class="logo-mark">
            <svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M14.5 34h19a8.5 8.5 0 0 0 .9-17 11 11 0 0 0-21.1 2.1A7.5 7.5 0 0 0 14.5 34Z" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
              <path d="M24 23v12m-5-5 5 5 5-5" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
          </div>
        </div>

        <h1 id="page-title"><span id="welcome-text">Welcome to </span><span>VaultStream</span></h1>
        <p class="intro" id="intro">
          Everything you need to know about storing files in the cloud—quick answers, no waiting.
        </p>

        <section class="qa-card" aria-labelledby="qa-title">
          <h2 class="qa-heading" id="qa-title">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="qa-heading-text">How can we help?</span>
          </h2>
          <div class="questions" id="questions" aria-label="Frequently asked questions">
            <button class="question-chip" type="button" data-answer="service">What is VaultStream?</button>
            <button class="question-chip" type="button" data-answer="upload">Can I upload files?</button>
            <button class="question-chip" type="button" data-answer="security">How are files protected?</button>
          </div>
          <div class="answer" id="answer" role="status" aria-live="polite">
            Choose a common question or type your own. This is an informational page only—file uploads and account management aren't available here yet.
          </div>
          <form class="ask-form" id="ask-form">
            <label class="sr-only" for="question-input" id="question-label">Type your question</label>
            <input
              class="question-input"
              id="question-input"
              name="question"
              type="text"
              placeholder="Type your question..."
              autocomplete="off"
              required
            />
            <button class="ask-button" type="submit" id="ask-button">Ask</button>
          </form>
        </section>
      </section>
    </main>

    <script>
      const translations = {
        en: {
          title: "VaultStream — Cloud Storage",
          description: "Quick information about cloud file storage from VaultStream.",
          brandLabel: "VaultStream — home",
          languageLabel: "Language",
          welcome: "Welcome to ",
          intro: "Everything you need to know about storing files in the cloud—quick answers, no waiting.",
          qaHeading: "How can we help?",
          questionsLabel: "Frequently asked questions",
          questions: {
            service: "What is VaultStream?",
            upload: "Can I upload files?",
            security: "How are files protected?",
          },
          welcomeAnswer: "Choose a common question or type your own. This is an informational page only—file uploads and account management aren't available here yet.",
          answers: {
            service: "VaultStream is an information interface about cloud file storage. This page isn't connected to a storage service or user accounts.",
            upload: "File uploads aren't available on this page right now. No files are sent or stored here.",
            security: "This page doesn't upload or store files, so it can't make guarantees about file security or encryption. Don't enter personal or sensitive information.",
            account: "Account creation and sign-in aren't available on this page right now.",
          },
          questionLabel: "Type your question",
          placeholder: "Type your question...",
          ask: "Ask",
          fallback: "I couldn't find an answer to that question. Try one of the common questions above.",
        },
        he: {
          title: "VaultStream — אחסון בענן",
          description: "מידע מהיר על אחסון קבצים בענן מבית VaultStream.",
          brandLabel: "VaultStream — לעמוד הראשי",
          languageLabel: "שפה",
          welcome: "ברוכים הבאים ל־",
          intro: "כל מה שרציתם לדעת על אחסון הקבצים שלכם בענן — תשובות מהירות, בלי לחכות.",
          qaHeading: "איך אפשר לעזור לכם?",
          questionsLabel: "שאלות נפוצות",
          questions: {
            service: "מהו VaultStream?",
            upload: "אפשר להעלות קבצים?",
            security: "איך שומרים על הקבצים?",
          },
          welcomeAnswer: "בחרו שאלה נפוצה או כתבו שאלה משלכם. זהו דף מידע בלבד — העלאת קבצים וניהול חשבון אינם זמינים כאן כרגע.",
          answers: {
            service: "VaultStream הוא ממשק מידע בנושא אחסון קבצים בענן. הדף הנוכחי אינו מחובר לשירות אחסון או לחשבונות משתמשים.",
            upload: "העלאת קבצים אינה זמינה בדף הזה כרגע. לא נשלחים או נשמרים כאן קבצים.",
            security: "אין בדף הזה העלאה או אחסון של קבצים, ולכן הוא אינו יכול להבטיח אבטחה או הצפנה של קבצים. אל תזינו מידע אישי או רגיש.",
            account: "יצירת חשבון והתחברות אינם זמינים בדף הזה כרגע.",
          },
          questionLabel: "כתבו את השאלה שלכם",
          placeholder: "כתבו שאלה...",
          ask: "שליחת שאלה",
          fallback: "לא מצאתי תשובה לשאלה הזו. אפשר לבחור אחת מהשאלות הנפוצות למעלה.",
        },
      };

      const keywords = {
        service: ["what is", "vaultstream", "service", "website", "מהו", "שירות", "אתר"],
        upload: ["upload", "file", "files", "storage", "להעלות", "העלאה", "קובץ", "קבצים", "אחסון"],
        security: ["security", "secure", "protect", "privacy", "encryption", "אבטחה", "מאובטח", "שומרים", "פרטיות", "הצפנה"],
        account: ["account", "sign up", "signup", "login", "password", "חשבון", "הרשמה", "התחברות", "סיסמה"],
      };

      const languageSelect = document.getElementById("language-select");
      const answer = document.getElementById("answer");
      const questionInput = document.getElementById("question-input");
      const questionButtons = document.querySelectorAll(".question-chip");
      let language = "en";
      let currentAnswer = "welcomeAnswer";

      function renderLanguage() {
        const content = translations[language];
        document.documentElement.lang = language;
        document.documentElement.dir = language === "he" ? "rtl" : "ltr";
        document.title = content.title;
        document.querySelector('meta[name="description"]').content = content.description;
        document.getElementById("brand-link").setAttribute("aria-label", content.brandLabel);
        document.getElementById("language-label").textContent = content.languageLabel;
        document.getElementById("welcome-text").textContent = content.welcome;
        document.getElementById("intro").textContent = content.intro;
        document.getElementById("qa-heading-text").textContent = content.qaHeading;
        document.getElementById("questions").setAttribute("aria-label", content.questionsLabel);
        questionButtons.forEach((button) => {
          button.textContent = content.questions[button.dataset.answer];
        });
        document.getElementById("question-label").textContent = content.questionLabel;
        questionInput.placeholder = content.placeholder;
        document.getElementById("ask-button").textContent = content.ask;
        answer.textContent = content.answers[currentAnswer] || content[currentAnswer] || content.fallback;
      }

      function showAnswer(answerKey) {
        currentAnswer = answerKey;
        const content = translations[language];
        answer.textContent = content.answers[answerKey] || content.fallback;
      }

      questionButtons.forEach((button) => {
        button.addEventListener("click", () => {
          showAnswer(button.dataset.answer);
        });
      });

      document.getElementById("ask-form").addEventListener("submit", (event) => {
        event.preventDefault();
        const question = questionInput.value.trim().toLocaleLowerCase();
        const answerKey = Object.entries(keywords).find(([, terms]) =>
          terms.some((term) => question.includes(term)),
        )?.[0] || "fallback";
        showAnswer(answerKey);
      });

      languageSelect.addEventListener("change", () => {
        language = languageSelect.value;
        renderLanguage();
      });

      renderLanguage();
    </script>
  </body>
</html>
